name: Centinela quality and preview package

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22.15.0'
          cache: npm
      - uses: denoland/setup-deno@v2
        with:
          deno-version: '2.9.6'
      - name: Install project dependencies
        run: npm ci
      - name: Verify literal preview and release guards
        run: |
          python3 tests/verify_recovered_script.py
          python3 tests/verify_candidate_content.py
          python3 scripts/build_candidate_script.py --check
          python3 scripts/generate_audio.py --check
          python3 scripts/release.py check --channel preview
      - name: Test storage, backend, dashboard and synchronization
        run: |
          npm run test:web-storage
          npm run test:web-sync
          npm run test:backend-sql
          npm run test:research-sql
          npm run test:dashboard-export
          npm run test:dashboard-browser
      - name: Typecheck Edge Functions
        run: deno check --node-modules-dir=auto supabase/functions/{register_save,claim_save,ingest_events,finalize_sync,research_admin}/index.ts
      - name: Install Godot 4.7.2 and matching export templates
        run: |
          set -euo pipefail
          base=https://github.com/godotengine/godot-builds/releases/download/4.7.2-stable
          curl -fL --retry 3 "$base/Godot_v4.7.2-stable_linux.x86_64.zip" -o "$RUNNER_TEMP/godot.zip"
          curl -fL --retry 3 "$base/Godot_v4.7.2-stable_export_templates.tpz" -o "$RUNNER_TEMP/templates.tpz"
          unzip -q "$RUNNER_TEMP/godot.zip" -d "$RUNNER_TEMP"
          unzip -q "$RUNNER_TEMP/templates.tpz" -d "$RUNNER_TEMP/godot-templates"
          mkdir -p "$HOME/.local/share/godot/export_templates/4.7.2.stable"
          cp -a "$RUNNER_TEMP/godot-templates/templates/." "$HOME/.local/share/godot/export_templates/4.7.2.stable/"
          chmod +x "$RUNNER_TEMP/Godot_v4.7.2-stable_linux.x86_64"
          ln -s "$RUNNER_TEMP/Godot_v4.7.2-stable_linux.x86_64" "$RUNNER_TEMP/godot"
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"
      - name: Test Godot and export Web
        run: |
          godot --headless --editor --import --path . --quit
          godot --headless --path . --scene res://tests/RunTests.tscn
          godot --headless --path . --scene res://tests/MobaReturnTests.tscn
          godot --headless --path . --scene res://tests/StoryRoutesTests.tscn
          mkdir -p build/web
          godot --headless --path . --export-debug 'Web Development' build/web/index.html
      - name: Test exported Web in browser
        run: |
          browser="$(command -v google-chrome || command -v chromium || true)"
          test -n "$browser"
          CENTINELA_BROWSER_EXE="$browser" npm run test:browser
      - name: Package and verify preview
        run: |
          python3 -m unittest discover -s tests -p test_release.py -v
          python3 scripts/release.py package --channel preview --output build/release-preview
          python3 scripts/release.py verify build/release-preview
      - uses: actions/upload-artifact@v4
        with:
          name: centinela-preview-${{ github.sha }}
          path: build/release-preview/
          if-no-files-found: error
          retention-days: 7
