[preset.0]

name="Web Development"
platform="Web"
runnable=true
advanced_options=false
dedicated_server=false
custom_features="development_build"
export_filter="all_resources"
include_filter="web/*.js"
exclude_filter="docs/*,tests/*,node_modules/*,build/*,README.md,package.json,package-lock.json"
export_path="build/web/index.html"

[preset.0.options]

custom_template/debug=""
custom_template/release=""
variant/extensions_support=false
vram_texture_compression/for_desktop=true
vram_texture_compression/for_mobile=false
html/export_icon=true
html/custom_html_shell=""
html/head_include=""
html/canvas_resize_policy=2
html/focus_canvas_on_start=true
progressive_web_app/enabled=false

[preset.1]

name="Web Staging"
platform="Web"
runnable=false
advanced_options=false
dedicated_server=false
custom_features=""
export_filter="all_resources"
include_filter="web/*.js"
exclude_filter="docs/*,tests/*,node_modules/*,build/*,README.md,package.json,package-lock.json,data/narrative/*RECOVERED_PREVIEW*,data/narrative/*TEST_ONLY*"
export_path="build/web/index.html"

[preset.1.options]

custom_template/debug=""
custom_template/release=""
variant/extensions_support=false
vram_texture_compression/for_desktop=true
vram_texture_compression/for_mobile=false
html/export_icon=true
html/custom_html_shell=""
html/head_include=""
html/canvas_resize_policy=2
html/focus_canvas_on_start=true
progressive_web_app/enabled=false
